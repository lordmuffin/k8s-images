name: Build brave-search-mcp

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag to build (brave/brave-search-mcp-server)"
        required: true
        default: v2.1.0

jobs:
  build:
    uses: ./.github/workflows/build-external-image.yml
    secrets: inherit
    with:
      upstream_repo: brave/brave-search-mcp-server
      upstream_ref: ${{ inputs.ref }}
      image_name: brave-search-mcp
