name: Build ARC runner image

# Two ways in:
#   - push to arc-runner/**: auto-builds and tags with the commit SHA only.
#     Never touches a stable tag, so it can't silently change what
#     np-home-homelab pins — that repo always references an explicit tag.
#   - workflow_dispatch: publishes (or re-tags) the stable, human-chosen tag
#     that np-home-homelab actually pins to. Use this to promote a build.
on:
  push:
    branches:
      - main
    paths:
      - "arc-runner/**"
      - ".github/workflows/build-arc-runner.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 2026-08-18 or v1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push arc-runner image
    # Deliberately ubuntu-latest, not this repo's own k8s-images-runners ARC
    # set — this build needs buildx and has no reason to touch the homelab LAN.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          TAGS="ghcr.io/lordmuffin/arc-runner:${{ github.sha }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAGS="ghcr.io/lordmuffin/arc-runner:${{ inputs.tag }}
          $TAGS"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./arc-runner
          file: ./arc-runner/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}

      - name: Emit pinned image reference
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### ARC runner image built"
            echo
            echo "Pin \`np-home-homelab/apps/ci/arc/helmrelease-runners.yaml\` to:"
            echo
            echo '```'
            echo "ghcr.io/lordmuffin/arc-runner:${{ inputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
