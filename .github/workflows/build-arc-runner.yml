name: Build ARC runner image

# Manual only — the consuming repo (np-home-homelab) pins an explicit tag, so
# rebuilding on every push would silently change what CI runs on there.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 2026-08-18 or v1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push arc-runner image
    # Deliberately ubuntu-latest, not this repo's own k8s-images-runners ARC
    # set — this build needs buildx and has no reason to touch the homelab LAN.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./arc-runner
          file: ./arc-runner/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/lordmuffin/arc-runner:${{ inputs.tag }}
            ghcr.io/lordmuffin/arc-runner:${{ github.sha }}

      - name: Emit pinned image reference
        run: |
          {
            echo "### ARC runner image built"
            echo
            echo "Pin \`np-home-homelab/apps/ci/arc/helmrelease-runners.yaml\` to:"
            echo
            echo '```'
            echo "ghcr.io/lordmuffin/arc-runner:${{ inputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
