name: Build and Publish

# Scoped to OpenBrain's actual inputs so unrelated changes elsewhere in this
# multi-image repo (arc-runner/**, flux/**, etc.) don't republish it.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths: &openbrain-paths
      - "Dockerfile"
      - "deno.json"
      - "index.ts"
      - ".github/workflows/build-and-publish.yml"
  pull_request:
    branches:
      - main
    paths: *openbrain-paths
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openbrain-mcp-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # No floating `latest` tag: the only consumer (np-home-homelab)
            # pins by digest and never reads it, so a moving tag on this
            # multi-arch image would just be an untracked footgun. If a
            # consumer needs `latest`, add it back deliberately and note
            # who relies on it here.
            # tag with short git SHA on every push
            type=sha,prefix=sha-
            # semver tags from v* git tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
