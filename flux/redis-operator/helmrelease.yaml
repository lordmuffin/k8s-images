---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: redis-operator
      version: "0.25.x"
      sourceRef:
        kind: HelmRepository
        name: ot-container-kit
      interval: 1h
  targetNamespace: redis-operator
  install:
    createNamespace: true
  values: {}
