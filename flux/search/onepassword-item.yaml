---
# Requires the 1Password Connect Kubernetes Operator to already be installed cluster-wide.
# Create the referenced item first, e.g. in the 1Password CLI:
#   op item create --category password --title SearXNG --vault HomeLab \
#     'secret_key[password]='"$(openssl rand -hex 32)"
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: searxng-secret-runtime
  namespace: search
spec:
  itemPath: "vaults/HomeLab/items/SearXNG"
